[package]
name = "tinyskills-drivers"
description = "tinyskills on the tinystoragedrivers ports: catalogs as documents, bundle files as a blob tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the published `tinyskills` crate stays free of any storage
# dependency; this adapter consumes only host-supplied storage ports.
publish = false

[dependencies]
tinyskills = { path = "../tinyskills", features = ["registry"] }
tinystoragedrivers-api.workspace = true
tinystoragedrivers-types.workspace = true
cap-std.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tinystoragedrivers-testkit.workspace = true

[lints]
workspace = true
